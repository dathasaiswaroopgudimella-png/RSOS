services:
  - type: web
    name: roadsos-api
    runtime: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.0"
